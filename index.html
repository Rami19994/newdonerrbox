<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>New Doner Box | Menu</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <div class="logo">
  <img src="assets/logo.jpg" alt="New Doner Box Logo">
</div>
      <div class="brandText">
        <h1 id="restName">New Doner Box</h1>
        <p>منيو رقمي</p>
        <p class="phone">
           <span class="callText">اتصل على الرقم:</span><br>
          <a href="tel:+9647517345401">07517345401</a>
          <p class="location">
          <span class="locText">العنوان:</span>
          <a href="https://www.google.com/maps/place/36%C2%B013'38.0%22N+43%C2%B059'56.9%22E/@36.2272184,44.0013237,17z/data=!3m1!4b1!4m4!3m3!8m2!3d36.2272184!4d43.999135?hl=ar&entry=ttu&g_ep=EgoyMDI2MDIxNy4wIKXMDSoASAFQAw%3D%3D" target="_blank">
            اضغط هنا
          </a>

        </p>
              
      </div>
    </div>

    <div class="searchWrap">
      <input id="search" type="search" placeholder="ابحث عن وجبة..." autocomplete="off" />
      <button id="clearSearch" class="iconBtn" title="مسح البحث">✕</button>
    </div>
  </header>

  <main class="container">

    <section class="summaryRow">
      <div class="summaryCard">
        <div class="summaryTitle">أهلاً 👋</div>
        <div class="summaryText">اختار القسم أو ابحث، والتفاصيل بتظهر داخل الوجبة بدون نوافذ مزعجة.</div>
      </div>

      <div class="countPill">
        <span class="dot"></span>
        <span id="itemsCount">0</span>
        <span>وجبة</span>
      </div>
    </section>

    <nav id="tabs" class="tabs" aria-label="الأقسام"></nav>

    <section>
      <div id="grid" class="grid" aria-live="polite"></div>

      <div id="empty" class="empty hidden">
        <div class="emptyCard">
          <h3>ماكو نتائج 😅</h3>
          <p>جرّب كلمة ثانية أو امسح البحث.</p>
          <button id="reset" class="btn">رجّع كل الوجبات</button>
        </div>
      </div>
    </section>

  </main>

  <script src="menu-data.js"></script>
<script src="app.js"></script>
</body>
</html>
